# ┌──────────────────────────────────────────────────────────────────────────┐
# │  DonutOrders 2 · messages.yml                                            │
# │  Every text players see. /orderadmin reload applies changes.             │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Formatting: MiniMessage (<gold>, <#49d6a0>, <gradient:#49d6a0:#ffc24b>text</gradient>, <b>), legacy & codes and
# &#RRGGBB hex, mixed freely. %placeholders% are filled in by the plugin; player-made text (names, searches) can never
# add formatting. Menu titles and button names are written in small capitals when style.small-caps is on.
# Missing keys fall back to the built-in English text, so this file can be trimmed to what you change.

# ─── Put in front of chat messages. ────────────────────────────────────────
prefix: "<#49d6a0><b>Orders</b> <dark_gray>» <reset>"

# ─── General ───────────────────────────────────────────────────────────────
general:
  busy: "&cPlease wait a moment."
  no-permission: "&cYou do not have permission to do that."
  not-yours: "&cThat is not your order."
  players-only: "&cOnly players can use this."
  server-name: "Server"
  starting: "&eDonutOrders is still starting. Try again in a moment."

# ─── Commands ──────────────────────────────────────────────────────────────
command:
  create-usage: "&cUsage: /order create <item|hand> <amount> <price> [time]"
  invalid-duration: "&cUse a time like 12h, 3d or 1w."
  order-usage: "&cUsage: /order [new|create|collect|mailbox|history|alerts|cancel]"
  unknown-item: "&cUnknown item: %item%"
  unknown-order: "&cNo order of yours has that id. The id is shown in &e/order&c."
  view-usage: "&cUsage: /orders view <player>"

# ─── /orders help ──────────────────────────────────────────────────────────
help:
  board: "&d/orders &7- browse open orders and deliver"
  create: "&d/order create <item|hand> <amount> <price> [time] &7- create without menus"
  mine: "&d/order &7- your orders: create, collect, change, cancel"
  price: "&d/orders price &7- what the held item sells for"
  search: "&d/orders <search> &7- find orders by item, enchantment or player"
  sell: "&d/orders sell [all] &7- sell your held item (or everything) to the best orders"
  view: "&d/orders view <player> &7- a player's open orders"

# ─── Questions asked in chat ───────────────────────────────────────────────
input:
  add-amount: "&eType how many items to add in chat, or &6%cancel% &eto go back."
  amount: "&eType the amount you want in chat, or &6%cancel% &eto go back."
  cancel-word: "cancel"
  cancelled: "&7Cancelled."
  catalog-search: "&eType part of an item name in chat, or &6%cancel% &eto go back."
  invalid-amount: "&cType a whole number from 1 to %max%."
  invalid-price: "&cThat is not a price."
  price: "&eType the price per item in chat (2.5k and 1m work), or &6%cancel% &eto go back."
  search: "&eType what you are looking for in chat, or &6%cancel% &eto go back."
  timeout: "&7No answer, so nothing was changed."

# ─── Creating orders ───────────────────────────────────────────────────────
create:
  amount-range: "&cThe amount must be between 1 and %max%."
  cancelled: "&cThat order cannot be created."
  cannot-afford: "&cThis order costs %cost% and you have %balance%."
  created: "&aOrder created: &f%amount%× %item% &afor &6%price% &aeach. &7%cost% is held until it is delivered."
  duration-range: "&cPick a duration between %min% and %max%."
  failed: "&cThe order could not be saved. Your money was refunded."
  limit: "&cYou already have %limit% open orders."
  no-exact: "&cYou can only order plain items and enchanted books."
  price-range: "&cThe price per item must be between %min% and %max%."
  total-too-high: "&cAn order may be worth at most %max%."

# ─── Delivering ────────────────────────────────────────────────────────────
deliver:
  busy: "&cThat order is busy. Try again."
  cancelled: "&cThat delivery was refused."
  closed: "&cThat order is no longer taking deliveries."
  delivered: "&aDelivered &f%amount%× %item% &ato %owner%'s order for &6%paid%&a.%tax%"
  failed: "&cThe delivery could not be saved. Your items were returned."
  full: "&cSomeone else filled that order first."
  nothing-matches: "&cYou have nothing this order wants."
  own-order: "&cYou cannot deliver to your own order."
  same-address: "&cYou cannot deliver to an order of a player on your connection."
  tax-part: " &7(%tax% tax)"
  wrong-item: "&cThis order only takes %item%."

# ─── /orders sell ──────────────────────────────────────────────────────────
sell:
  nothing: "&cNo open order wants what you are selling."
  sold: "&aSold &f%amount% &aitems to &f%orders% &aorders for &6%paid%&a.%tax%"

# ─── /orders price ─────────────────────────────────────────────────────────
price:
  best: "&7Best open order: &6%price% &7each (%count% orders want %items%)"
  header: "&dPrice check: &f%item%"
  history: "&7Average &6%average% &7(range %min% to %max%, last %last%) over %items% items"
  hold-item: "&cHold the item you want to price."
  no-history: "&7No recent deliveries of this item."
  no-open: "&7No open orders want this right now."

# ─── Collecting ────────────────────────────────────────────────────────────
collect:
  collected: "&aCollected &f%count% &aitems."
  full: "&cMake room in your inventory first."
  nothing: "&7Nothing to collect."

# ─── Mailbox ───────────────────────────────────────────────────────────────
mail:
  received: "&eSome items did not fit in your inventory and wait in your mailbox: &6/order mailbox"

# ─── Cancelling ────────────────────────────────────────────────────────────
cancel:
  cancelled: "&aOrder cancelled. &6%refund% &awas refunded.%waiting%"
  failed: "&cThe order could not be cancelled. Try again."
  items-waiting: " &7Delivered items wait in &e/order&7."
  not-open: "&cThat order is already closed."

# ─── Changing an order ─────────────────────────────────────────────────────
edit:
  changed: "&cThat order changed in the meantime. Nothing was charged; try again."
  charged: " &7%amount% was added to the order."
  no-decrease: "&cOrder prices can only go up."
  refunded: " &7%amount% was refunded."
  saved: "&aOrder updated.%money%"

# ─── /order alerts ─────────────────────────────────────────────────────────
alerts:
  disabled: "&7Delivery alerts and order announcements are off."
  enabled: "&aDelivery alerts and order announcements are on."

# ─── Notifications to buyers ───────────────────────────────────────────────
notify:
  delivered: "<green>%sellers% delivered <white>%amount%× %item%</white> to your order <gray>(%delivered%/%wanted%)</gray>. <yellow>/order</yellow> to collect."
  filled: "<green>Your order for <white>%amount%× %item%</white> is complete! <yellow>/order</yellow> to collect."
  filled-subtitle: "<white>%amount%× %item%"
  filled-title: "<gradient:#49d6a0:#b8f5dc><b>ORDER FILLED</b>"
  items-waiting: "<gray>%count% delivered items wait for you in <yellow>/order</yellow>."
  many-sellers: "%first% and %count% others"
  owed-paid: "<green>You received <gold>%amount%</gold> from your orders."
  staff-reason: " (%reason%)"
  summary-closed: " <dark_gray>•</dark_gray> <gray>%count% orders ended, <gold>%refund%</gold> refunded"
  summary-deliveries: " <dark_gray>•</dark_gray> <white>%items%</white> items delivered to your orders <gray>(%value%)"
  summary-filled: " <dark_gray>•</dark_gray> <green>%count%</green> orders filled"
  summary-header: "<#49d6a0><b>While you were away</b>"

# ─── New-order announcement ────────────────────────────────────────────────
broadcast:
  button: " <green><b>[Deliver]</b>"
  hover: "<gray>Click to deliver to this order"
  new-order: "<gray>%player% <white>wants <yellow>%amount%× %item%</yellow> for <gold>%price%</gold> each."

# ─── Staff ─────────────────────────────────────────────────────────────────
admin:
  cancelled: "&aCancelled order %order% of %owner%; %refund% refunded."
  frozen: "&eThe order market is frozen: nobody can create or deliver until /orderadmin unfreeze."
  history-usage: "&cUsage (in game): /orderadmin history <player>"
  info-cache: "&7Cached: &f%cached% &7orders (%active% open) · market %state%"
  info-database: "&7Database: &f%counts%"
  info-header: "&dDonutOrders %version% &7on %server%"
  info-storage: "&7Storage: &f%storage% &7· Economy: &f%economy%"
  info-unreadable: "&c%count% rows could not be read on this server version."
  purge-usage: "&cUsage: /orderadmin purge <days>"
  purged: "&aRemoved %count% finished orders older than %days% days."
  reloaded: "&aDonutOrders configuration and messages reloaded."
  server-created: "&aServer order %order% created."
  server-failed: "&cThe server order could not be saved."
  server-usage: "&cUsage: /orderadmin server <item|hand> <amount|unlimited> <price> [time]"
  suspicious: "&c%seller% delivered to %owner%'s order %order% from the same address."
  unfrozen: "&aThe order market is open again."
  unknown-order: "&cNo open order has that id."
  usage: "&cUsage: /orderadmin <reload|info|view|history|cancel|purge|server|freeze|unfreeze>"
  view-usage: "&cUsage (in game): /orderadmin view <player>"

# ─── Update check ──────────────────────────────────────────────────────────
update:
  available: "&eA newer version of DonutOrders is available."
  up-to-date: "&aDonutOrders is up to date."
  version-line: "&7Current: %current%  Latest: %latest%"

