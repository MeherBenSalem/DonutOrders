# ─────────────────────────────────────────────────────────────────────────────
#  DonutOrders  –  config.yml
# ─────────────────────────────────────────────────────────────────────────────

update-check:
  # Check Modrinth for a newer release when the plugin starts.
  enabled: true

orders:
  # Maximum simultaneous active orders a single player can hold.
  max-per-player: 10

  # How many days an order lives before it expires and is refunded.
  default-expiry-days: 7

  # Percentage tax taken from each payout to the seller.
  # Set to 0 to disable.  Tax is silently discarded (economy sink).
  tax-percent: 0.0

database:
  # Filename of the SQLite database, relative to the plugin data folder.
  filename: donutorders.db

gui:
  # How many order entries to show per page on the public orders GUI.
  orders-per-page: 45

# Allowed order materials are configured in items.yml.
