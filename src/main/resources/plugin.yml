name: DonutOrders
version: '${project.version}'
main: io.nightbeam.donutorders.DonutOrdersPlugin
# Loads on 1.20.1 and every newer version up to 26.3.
api-version: '1.20'
folia-supported: true
description: Buy orders for Paper and Folia. Players post what they want, others deliver it and get paid.
author: NightBeam
website: https://github.com/MeherBenSalem/DonutOrders
softdepend: [Vault, VaultUnlocked, PlaceholderAPI, LuckPerms]

commands:
  orders:
    description: Browse open orders, deliver, sell and check prices.
    usage: /orders [search|sell|price|view|help]
    aliases: [market, donutorders]
  order:
    description: Your orders. Create, collect, change and cancel them.
    usage: /order [new|create|collect|mailbox|history|alerts|cancel]
  orderadmin:
    description: DonutOrders staff tools.
    usage: /orderadmin <reload|info|view|history|cancel|purge|server|freeze|unfreeze>
    aliases: [ordersadmin]

permissions:
  donutorders.use:
    description: Open the board and your orders.
    default: true
    children:
      donutorders.create: true
      donutorders.deliver: true
      donutorders.sell: true
  donutorders.create:
    description: Create orders.
    default: true
  donutorders.create.exact:
    description: Order the exact item in your hand (potions, custom items, anything with variants).
    default: true
  donutorders.deliver:
    description: Deliver items to orders.
    default: true
  donutorders.sell:
    description: Use /orders sell and the board's sell button.
    default: true
  donutorders.limit.unlimited:
    description: No limit on open orders. donutorders.limit.<number> raises the limit to that number.
    default: op
  donutorders.fee.exempt:
    description: No creation fee.
    default: false
  donutorders.bypass.restrictions:
    description: Use orders in disabled worlds and game modes, and while the market is frozen.
    default: op
  donutorders.bypass.cooldown:
    description: No wait between creating orders.
    default: op
  donutorders.bypass.blacklist:
    description: Order blacklisted items.
    default: op
  donutorders.bypass.amount:
    description: No cap on the amount of one order.
    default: op
  donutorders.bypass.address:
    description: Not checked for deliveries between players on one address.
    default: false
  donutorders.admin:
    description: /orderadmin, cancelling any order from the board.
    default: op
    children:
      donutorders.admin.alerts: true
      donutorders.update.notify: true
  donutorders.admin.alerts:
    description: Told about suspicious deliveries.
    default: op
  donutorders.update.notify:
    description: Told about new versions on join.
    default: op
