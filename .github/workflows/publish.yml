# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
#
# Rule: EACH jar becomes its OWN Modrinth version and OWN CurseForge file
# with the correct Minecraft version + loader tags. Never attach multiple
# loader/MC jars as secondary files on a single version.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#   DEFAULT_LOADER (optional; e.g. paper for plugins when jar name has no loader)
#   DEFAULT_GAME_VERSION (optional; e.g. 1.21.1 when jar name has no MC version)
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-common-*" ! -name "*-dev*.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "list<<$EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
            printf 'Using prebuilt jars:\n'
            printf '%s\n' "${JARS[@]}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No releases/*-${VERSION}.jar — will attempt Gradle build"
          fi

      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true'

      - name: Build MultiLoader workspaces
        if: steps.prebuilt.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          built=0
          for ws in 1.20.1 1.21.1 26.1.2 26.2; do
            if [ -f "$ws/gradlew" ] || [ -f "$ws/settings.gradle" ] || [ -f "$ws/settings.gradle.kts" ]; then
              echo "Building workspace $ws"
              (
                cd "$ws"
                chmod +x gradlew 2>/dev/null || true
                if [ -f gradlew ]; then ./gradlew build --no-daemon
                else gradle build --no-daemon
                fi
              )
              built=1
            fi
          done
          if [ -f gradlew ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            chmod +x gradlew 2>/dev/null || true
            if [ -f gradlew ]; then ./gradlew build --no-daemon
            else gradle build --no-daemon
            fi
            built=1
          fi
          if [ "$built" -eq 0 ]; then
            echo "No Gradle project found at repo root or known workspaces" >&2
            exit 1
          fi

      - name: Find jars
        id: jars
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find . -type f -path "*/build/libs/*-${VERSION}.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
              ! -name "*-common-*" ! -path "*/common/build/*" | sort)
          fi
          # Drop empty / near-empty jars (broken remapJar outputs)
          FILTERED=()
          for j in "${JARS[@]}"; do
            size=$(stat -c%s "$j" 2>/dev/null || stat -f%z "$j")
            if [ "$size" -lt 1024 ]; then
              echo "Skipping empty/tiny jar ($size bytes): $j" >&2
              continue
            fi
            FILTERED+=("$j")
          done
          JARS=("${FILTERED[@]}")
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars found for version ${VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge (one version per jar)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          DEFAULT_LOADER: ${{ vars.DEFAULT_LOADER }}
          DEFAULT_GAME_VERSION: ${{ vars.DEFAULT_GAME_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const platforms = (process.env.PLATFORMS || 'both').toLowerCase();
          const doModrinth = platforms === 'both' || platforms === 'modrinth';
          const doCurse = platforms === 'both' || platforms === 'curseforge';
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          if (!jars.length) throw new Error('No jars to upload');

          function resolveChangelog(ver) {
            const candidates = [
              `CHANGELOG.md`,
              `PATCH_NOTES.md`,
              ...fs.readdirSync('.').filter((f) =>
                f.toLowerCase().endsWith(`-${ver}-patchnotes.md`) ||
                f.toLowerCase() === `${ver}-patchnotes.md`
              ),
            ];
            for (const f of candidates) {
              if (fs.existsSync(f)) return fs.readFileSync(f, 'utf8');
            }
            return `Release ${ver}`;
          }
          const changelog = resolveChangelog(version);

          // Stable CurseForge loader version IDs (Upload API Game Versions docs)
          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150, quilt: 9153 };

          function detect(jar) {
            const n = path.basename(jar).toLowerCase();
            const p = jar.replace(/\\/g, '/').toLowerCase();
            let loader = null;
            if (n.includes('neoforge') || p.includes('/neoforge/')) loader = 'neoforge';
            else if (n.includes('fabric') || p.includes('/fabric/')) loader = 'fabric';
            else if (n.includes('quilt') || p.includes('/quilt/')) loader = 'quilt';
            else if (n.includes('forge') || p.includes('/forge/')) loader = 'forge';
            else if (
              n.includes('paper') || n.includes('bukkit') || n.includes('spigot') ||
              n.includes('folia') || n.includes('purpur') ||
              fs.existsSync('src/main/resources/plugin.yml') ||
              fs.existsSync('plugin.yml')
            ) {
              loader = 'paper';
            } else if (process.env.DEFAULT_LOADER) {
              loader = process.env.DEFAULT_LOADER.toLowerCase();
            } else {
              loader = 'fabric';
            }
            let gv = null;
            const m26 = n.match(/(?:^|-)(26\.\d+(?:\.\d+)?)(?:-|$)/);
            const m1 = n.match(/(?:^|-)(1\.\d+(?:\.\d+)?)(?:-|$)/);
            if (m26) gv = m26[1];
            else if (m1) gv = m1[1];
            // Plugin-only projects often omit MC in the jar name; allow override
            if (!gv && process.env.DEFAULT_GAME_VERSION) gv = process.env.DEFAULT_GAME_VERSION;
            return { loader, gv };
          }

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry && (entry.id != null) && entry.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            const loose = flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return loose?.id;
          }

          (async () => {
            if (doModrinth) {
              let uploaded = 0;
              for (const jar of jars) {
                const { loader, gv } = detect(jar);
                const gameVersions = gv ? [gv] : ['1.21.1'];
                // One Modrinth version per jar — never multi-file attach across loaders/MC lines
                const body = {
                  name: `${version} · ${loader} · ${gameVersions[0]}`,
                  version_number: `${version}+${loader}-${gameVersions[0]}`,
                  changelog,
                  dependencies: [],
                  game_versions: gameVersions,
                  version_type: 'release',
                  loaders: [loader === 'paper' ? 'paper' : loader],
                  featured: false,
                  status: 'listed',
                  project_id: process.env.MODRINTH_ID,
                  file_parts: ['file_0'],
                  primary_file: 'file_0',
                };
                const form = new FormData();
                form.append('data', JSON.stringify(body));
                form.append('file_0', new Blob([fs.readFileSync(jar)]), path.basename(jar));
                const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                  method: 'POST',
                  headers: { Authorization: process.env.MODRINTH_TOKEN },
                  body: form,
                });
                const mrText = await mrRes.text();
                if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
                console.log('Modrinth OK', body.version_number, path.basename(jar), mrText.slice(0, 160));
                uploaded += 1;
              }
              console.log('Modrinth uploaded', uploaded, 'separate version(s)');
            } else {
              console.log('Skipping Modrinth (platforms=' + platforms + ')');
            }

            if (!doCurse) {
              console.log('Skipping CurseForge (platforms=' + platforms + ')');
              return;
            }

            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) {
              flat = flattenVersions(await uploadGv.json());
              console.log('CurseForge versions via upload API:', flat.length);
            } else {
              console.warn('Upload game/versions failed', uploadGv.status, (await uploadGv.text()).slice(0, 200));
            }
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              const gvText = await gvRes.text();
              if (!gvRes.ok) throw new Error('CurseForge versions ' + gvRes.status + ' ' + gvText.slice(0, 300));
              flat = flattenVersions(JSON.parse(gvText));
              console.log('CurseForge versions via core API:', flat.length);
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            let uploaded = 0;
            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const want = gv || '1.21.1';
              const mcId = findVersionId(flat, want);
              const loaderId = LOADER_IDS[loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) {
                throw new Error('No CurseForge game version id for ' + want + ' (' + path.basename(jar) + ')');
              }
              // Paper/plugins may not have a CF loader tag; still upload with MC + env tags
              const gameVersions = [mcId];
              if (loaderId != null) gameVersions.push(loaderId);
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              const gameVersionNames = [];
              if (clientId == null) gameVersionNames.push('Client');
              if (serverId == null) gameVersionNames.push('Server');
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${loader} · ${want}`,
                gameVersions,
                releaseType: 'release',
              };
              if (gameVersionNames.length) meta.gameVersionNames = gameVersionNames;
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, path.basename(jar), cfText.slice(0, 160));
              uploaded += 1;
            }
            console.log('CurseForge uploaded', uploaded, 'separate file(s) to project', process.env.CURSEFORGE_ID);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
