# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
# Supports Gradle (build/libs) and Maven (target/) projects.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('**/gradlew', '**/build.gradle*', '**/settings.gradle*') != '' && hashFiles('pom.xml') == '' }}

      - name: Build (Maven)
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn -B -q -DskipTests package

      - name: Build (Gradle)
        if: ${{ hashFiles('pom.xml') == '' }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew build --no-daemon
          else gradle build --no-daemon
          fi

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(
            find . -type f \( -path "*/build/libs/*.jar" -o -path "./target/*.jar" \) \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
              ! -name "original-*" ! -name "*-tests.jar" \
              | head -n 20
          )
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars found in build/libs or target" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          // Plugin jars (DonutOrders, etc.) — prefer paper family loaders
          const base = jars.map(j => path.basename(j).toLowerCase()).join(' ');
          const isPlugin = /donut|paper|spigot|bukkit|folia|purpur/.test(base) || !/(fabric|forge|neoforge|quilt)/.test(base);
          const loaders = isPlugin
            ? ['paper', 'bukkit', 'spigot', 'purpur', 'folia']
            : (() => {
                const s = new Set();
                for (const jar of jars) {
                  const n = path.basename(jar).toLowerCase();
                  if (n.includes('neoforge')) s.add('neoforge');
                  else if (n.includes('fabric')) s.add('fabric');
                  else if (n.includes('quilt')) s.add('quilt');
                  else if (n.includes('forge')) s.add('forge');
                  else s.add('fabric');
                }
                return [...s];
              })();
          const gvs = isPlugin
            ? ['1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8']
            : (() => {
                const s = new Set();
                for (const jar of jars) {
                  const m = path.basename(jar).toLowerCase().match(/1\.\d+(?:\.\d+)?/);
                  if (m) s.add(m[0]);
                }
                if (!s.size) s.add('1.21.1');
                return [...s];
              })();

          // Prefer jar matching VERSION; skip original-* and older versioned jars
          const primaryJars = jars
            .filter(j => !path.basename(j).startsWith('original-'))
            .sort((a, b) => {
              const an = path.basename(a);
              const bn = path.basename(b);
              const aMatch = an.includes(version) ? 0 : 1;
              const bMatch = bn.includes(version) ? 0 : 1;
              return aMatch - bMatch || an.localeCompare(bn);
            });
          const uploadJars = primaryJars.length ? [primaryJars[0]] : [jars[0]];
          console.log('Uploading jars:', uploadJars);

          (async () => {
            const changelog = fs.existsSync(`DonutOrders-${version}-PatchNotes.md`)
              ? fs.readFileSync(`DonutOrders-${version}-PatchNotes.md`, 'utf8')
              : `Release ${version}`;
            const fileParts = uploadJars.map((_, i) => `file_${i}`);
            const body = {
              name: version,
              version_number: version,
              changelog,
              dependencies: [],
              game_versions: gvs,
              version_type: 'release',
              loaders,
              featured: false,
              status: 'listed',
              project_id: process.env.MODRINTH_ID,
              file_parts: fileParts,
              primary_file: fileParts[0],
            };
            const form = new FormData();
            form.append('data', JSON.stringify(body));
            for (let i = 0; i < uploadJars.length; i++) {
              form.append(fileParts[i], new Blob([fs.readFileSync(uploadJars[i])]), path.basename(uploadJars[i]));
            }
            const mrRes = await fetch('https://api.modrinth.com/v2/version', {
              method: 'POST',
              headers: { Authorization: process.env.MODRINTH_TOKEN },
              body: form,
            });
            const mrText = await mrRes.text();
            if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
            console.log('Modrinth OK', mrText.slice(0, 180));

            // CurseForge: use legacy game/versions list + Bukkit type IDs + releaseType string
            const gvRes = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            const flat = await gvRes.json();
            const gameVersionIds = gvs.map((want) => {
              const hit = flat.find((v) => v.name === want && v.gameVersionTypeID === 1)
                || flat.find((v) => v.name === want);
              if (!hit) throw new Error('No CF game version for ' + want);
              return hit.id;
            });

            for (const jar of uploadJars) {
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: path.basename(jar),
                gameVersions: gameVersionIds,
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', path.basename(jar), cfText.slice(0, 180));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
