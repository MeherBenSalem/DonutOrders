# Publish NightBeam mods/plugins to CurseForge on version tags (NightBeam convention: CurseForge only since 24 Nov 2026).
#
# Rule: EACH jar becomes its OWN CurseForge file with the correct Minecraft version + loader tags.
# Never attach multiple loader/MC jars as secondary files on a single file.
#
# Secrets:
#   CURSEFORGE_TOKEN    (upload)
#   CURSEFORGE_API_KEY  (Core API, for the same-day guard)
#
# Repo variables:
#   CURSEFORGE_ID
#   DEFAULT_LOADER (optional; e.g. paper for plugins when jar name has no loader)
#   DEFAULT_GAME_VERSION (optional; e.g. 1.21.1 when jar name has no MC version)
#
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags
#
# Runs only on a v*.*.* tag or by hand; a push to main never releases anything.
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this plugin already had a
# release today (Africa/Tunis day), on CurseForge or in an earlier Publish run of this repo. It runs first and again
# right before the upload; a dry run only reports. It needs CURSEFORGE_ID (variable) and CURSEFORGE_API_KEY (secret).
# Prove it first: gh workflow run publish.yml -f version=<version> -f dry_run=true

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge (one version per jar)|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --test scripts/same_day_guard.test.mjs
          node scripts/same_day_guard.mjs

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-common-*" ! -name "*-dev*.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "list<<$EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
            printf 'Using prebuilt jars:\n'
            printf '%s\n' "${JARS[@]}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No releases/*-${VERSION}.jar — will attempt Maven or Gradle build"
          fi

      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Maven plugin
        if: steps.prebuilt.outputs.found != 'true'
        id: maven
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [ ! -f pom.xml ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml — skip Maven"
            exit 0
          fi
          mvn -B package
          mkdir -p releases
          copied=0
          shopt -s nullglob
          for j in target/*-"${VERSION}".jar; do
            case "$j" in
              *-sources.jar|*-javadoc.jar|*/original-*) continue ;;
            esac
            cp -v "$j" releases/
            copied=1
          done
          if [ "$copied" -eq 0 ]; then
            echo "Maven package produced no target/*-${VERSION}.jar" >&2
            exit 1
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.maven.outputs.built != 'true'

      - name: Build MultiLoader workspaces
        if: steps.prebuilt.outputs.found != 'true' && steps.maven.outputs.built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          built=0
          for ws in 1.20.1 1.21.1 26.1.2 26.2 26.3; do
            if [ -f "$ws/gradlew" ] || [ -f "$ws/settings.gradle" ] || [ -f "$ws/settings.gradle.kts" ]; then
              echo "Building workspace $ws"
              (
                cd "$ws"
                chmod +x gradlew 2>/dev/null || true
                if [ -f gradlew ]; then ./gradlew build --no-daemon
                else gradle build --no-daemon
                fi
              )
              built=1
            fi
          done
          if [ -f gradlew ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            chmod +x gradlew 2>/dev/null || true
            if [ -f gradlew ]; then ./gradlew build --no-daemon
            else gradle build --no-daemon
            fi
            built=1
          fi
          if [ "$built" -eq 0 ]; then
            echo "No Gradle project found at repo root or known workspaces" >&2
            exit 1
          fi

      - name: Find jars
        id: jars
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find target -maxdepth 1 -type f -name "*-${VERSION}.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "original-*" 2>/dev/null | sort)
          fi
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find . -type f -path "*/build/libs/*-${VERSION}.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
              ! -name "*-common-*" ! -path "*/common/build/*" | sort)
          fi
          # Drop empty / near-empty jars (broken remapJar outputs)
          FILTERED=()
          for j in "${JARS[@]}"; do
            size=$(stat -c%s "$j" 2>/dev/null || stat -f%z "$j")
            if [ "$size" -lt 1024 ]; then
              echo "Skipping empty/tiny jar ($size bytes): $j" >&2
              continue
            fi
            FILTERED+=("$j")
          done
          JARS=("${FILTERED[@]}")
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars found for version ${VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge (one version per jar)|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          DEFAULT_LOADER: ${{ vars.DEFAULT_LOADER }}
          DEFAULT_GAME_VERSION: ${{ vars.DEFAULT_GAME_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          if (!jars.length) throw new Error('No jars to upload');

          function resolveChangelog(ver) {
            // The release's own notes first (DonutOrders-<ver>-PatchNotes.md), then its section of PATCH_NOTES.md.
            const named = fs.readdirSync('.').filter((f) =>
              f.toLowerCase().endsWith(`-${ver}-patchnotes.md`) || f.toLowerCase() === `${ver}-patchnotes.md`);
            for (const f of named) return fs.readFileSync(f, 'utf8');
            for (const f of ['CHANGELOG.md', 'PATCH_NOTES.md']) {
              if (!fs.existsSync(f)) continue;
              const lines = fs.readFileSync(f, 'utf8').split(/\r?\n/);
              const start = lines.findIndex((line) => line.trim() === `## ${ver}` || line.trim().startsWith(`## ${ver} `));
              if (start < 0) continue;
              const rest = lines.slice(start + 1);
              const end = rest.findIndex((line) => /^##\s/.test(line.trim()));
              return (end < 0 ? rest : rest.slice(0, end)).join('\n').trim();
            }
            return `Release ${ver}`;
          }
          const changelog = resolveChangelog(version);

          // Stable CurseForge loader version IDs (Upload API Game Versions docs)
          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150, quilt: 9153 };

          function detect(jar) {
            const n = path.basename(jar).toLowerCase();
            const p = jar.replace(/\\/g, '/').toLowerCase();
            const isPlugin = fs.existsSync('src/main/resources/plugin.yml')
              || fs.existsSync('plugin.yml');
            let loader = null;
            if (n.includes('neoforge') || p.includes('/neoforge/')) loader = 'neoforge';
            else if (n.includes('fabric') || p.includes('/fabric/')) loader = 'fabric';
            else if (n.includes('quilt') || p.includes('/quilt/')) loader = 'quilt';
            else if (n.includes('forge') || p.includes('/forge/')) loader = 'forge';
            else if (
              n.includes('paper') || n.includes('bukkit') || n.includes('spigot') ||
              n.includes('folia') || n.includes('purpur') || isPlugin
            ) {
              loader = isPlugin ? 'bukkit-plugin' : 'paper';
            } else if (process.env.DEFAULT_LOADER) {
              loader = process.env.DEFAULT_LOADER.toLowerCase();
            } else {
              loader = 'fabric';
            }
            let gv = null;
            const m26 = n.match(/(?:^|-)(26\.\d+(?:\.\d+)?)(?:-|$)/);
            const m1 = n.match(/(?:^|-)(1\.\d+(?:\.\d+)?)(?:-|$)/);
            if (m26) gv = m26[1];
            else if (m1) gv = m1[1];
            // Plugin-only projects often omit MC in the jar name; allow override
            if (!gv && process.env.DEFAULT_GAME_VERSION) gv = process.env.DEFAULT_GAME_VERSION;
            return { loader, gv, isPlugin };
          }

          // Minecraft versions come from release/supported-minecraft.json when it has them.
          const support = fs.existsSync('release/supported-minecraft.json')
            ? JSON.parse(fs.readFileSync('release/supported-minecraft.json', 'utf8')) : null;
          const PLUGIN_GAME_VERSIONS = Array.isArray(support) ? support
            : support && Array.isArray(support.game_versions) ? support.game_versions : [
            '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
            '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
            '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
            '26.1', '26.1.1', '26.1.2', '26.2', '26.3',
          ];

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry && (entry.id != null) && entry.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            const loose = flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return loose?.id;
          }

          (async () => {
            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) {
              flat = flattenVersions(await uploadGv.json());
              console.log('CurseForge versions via upload API:', flat.length);
            } else {
              console.warn('Upload game/versions failed', uploadGv.status, (await uploadGv.text()).slice(0, 200));
            }
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              const gvText = await gvRes.text();
              if (!gvRes.ok) throw new Error('CurseForge versions ' + gvRes.status + ' ' + gvText.slice(0, 300));
              flat = flattenVersions(JSON.parse(gvText));
              console.log('CurseForge versions via core API:', flat.length);
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            let uploaded = 0;
            for (const jar of jars) {
              const { loader, gv, isPlugin } = detect(jar);
              if (isPlugin) {
                const gameVersionNames = [
                  ...PLUGIN_GAME_VERSIONS,
                  'Bukkit', 'Spigot', 'Paper', 'Purpur', 'Folia', 'Client', 'Server',
                ];
                const meta = {
                  changelog,
                  changelogType: 'markdown',
                  displayName: `${version}`,
                  gameVersionNames,
                  releaseType: 'release',
                };
                const cfForm = new FormData();
                cfForm.append('metadata', JSON.stringify(meta));
                cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
                const cfRes = await fetch(
                  `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                  { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
                );
                const cfText = await cfRes.text();
                if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
                console.log('CurseForge OK', meta.displayName, path.basename(jar), cfText.slice(0, 160));
                uploaded += 1;
                continue;
              }

              const want = gv || '1.21.1';
              const mcId = findVersionId(flat, want);
              const loaderId = LOADER_IDS[loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) {
                throw new Error('No CurseForge game version id for ' + want + ' (' + path.basename(jar) + ')');
              }
              // Paper/plugins may not have a CF loader tag; still upload with MC + env tags
              const gameVersions = [mcId];
              if (loaderId != null) gameVersions.push(loaderId);
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              const gameVersionNames = [];
              if (clientId == null) gameVersionNames.push('Client');
              if (serverId == null) gameVersionNames.push('Server');
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${loader} · ${want}`,
                gameVersions,
                releaseType: 'release',
              };
              if (gameVersionNames.length) meta.gameVersionNames = gameVersionNames;
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, path.basename(jar), cfText.slice(0, 160));
              uploaded += 1;
            }
            console.log('CurseForge uploaded', uploaded, 'separate file(s) to project', process.env.CURSEFORGE_ID);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
