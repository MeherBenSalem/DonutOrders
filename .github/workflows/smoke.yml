# Real servers and network clients across the supported range (tools/smoke/README.md).
# Manual: Actions > Smoke matrix > Run workflow. Downloads are cached between runs.
name: Smoke matrix

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets (project-version), empty for all"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ORDERLAB_HOME: ${{ github.workspace }}/.smoke-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .smoke-cache/cache
          key: smoke-cache-v1
      - name: Build plugin and fixture
        run: |
          mvn -B -q -DskipTests package
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -q -f tools/smoke/fixture/pom.xml package -Ddonutorders.version="$VERSION" -Ddonutorders.jar="$PWD/target/DonutOrders-$VERSION.jar"
      - run: npm --prefix tools/smoke install
      - name: Run matrix
        run: node tools/smoke/run.mjs ${{ inputs.targets }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            .smoke-cache/reports/
            .smoke-cache/servers/*/console.log
            .smoke-cache/servers/*/chat-*.log
          if-no-files-found: ignore
