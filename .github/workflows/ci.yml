name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: donutorders_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -q test
      - name: Order book on native MySQL
        run: mvn -B -q -Dorders.test.mysql.url=jdbc:mysql://127.0.0.1:3306/donutorders_test -Dorders.test.mysql.password=test -Dtest=SqlOrderRepositoryTest test
      - name: Messages file matches the code
        run: |
          python3 tools/messages/extract.py
          git diff --exit-code src/main/resources/messages.yml
